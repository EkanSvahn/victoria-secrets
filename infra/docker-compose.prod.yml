services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      LISTEN_ADDR: ":8080"
      REDIS_URL: "redis://redis:6379/0"
      MAX_BODY_BYTES: "7000000"
      MAX_META_BYTES: "16384"
      MAX_CIPHERTEXT_BYTES: "6500000"
      MAX_FILE_BYTES: "4194304"
      ALLOWED_FILE_MIME_TYPES: "application/pdf,image/png,image/jpeg,text/plain,application/octet-stream"
      MAX_TTL_SECONDS: "86400"
      MAX_VIEWS: "100"
      ID_LENGTH_BYTES: "24"
      REQUEST_TIMEOUT_MS: "5000"
      ALLOWED_ORIGINS: "https://vaultdrop.example.com"
      RATE_LIMIT_RPM: "120"
      RATE_LIMIT_BURST: "40"
      REQUIRE_PASSWORD: "true"
      STRICT_REDIS_EPHEMERAL: "true"
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: "/api"
        VITE_REQUIRE_PASSWORD: "true"
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: caddy:2.8-alpine
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
