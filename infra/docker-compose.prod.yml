services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      LISTEN_ADDR: ":8080"
      REDIS_URL: "redis://redis:6379/0"
      MAX_BODY_BYTES: "7000000"
      MAX_META_BYTES: "16384"
      MAX_CIPHERTEXT_BYTES: "6500000"
      MAX_TTL_SECONDS: "86400"
      ID_LENGTH_BYTES: "24"
      REQUEST_TIMEOUT_MS: "5000"
      ALLOWED_ORIGINS: "https://vaultdrop.example.com"
      RATE_LIMIT_RPM: "120"
      RATE_LIMIT_BURST: "40"
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
