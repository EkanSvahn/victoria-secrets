name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
      - name: Vulnerability scan (Go)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Vulnerability scan (npm)
        working-directory: frontend
        run: |
          npm audit --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ephemeral-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ephemeral-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ephemeral-backend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ephemeral-frontend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
